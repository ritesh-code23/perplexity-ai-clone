<!DOCTYPE html>
<html>
<head>
    <title>Perplexity Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Perplexity Clone 🚀</h1>

        <div id="chatContainer"></div>

        <div class="input-area">

            <select id="mode">
            <option value="writing">
             Writing Assistant
            </option>

            <option value="web">
                Web Search
            </option>
        </select>

            <textarea
                id="prompt"
                placeholder="Ask anything..."
            ></textarea>

            <button id="sendBtn">
                Send
            </button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
